version: "3.9"

services:
  gm_taxi_app:
    image: ${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG:-latest}
    container_name: gm_taxi_app
    restart: always
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      # Stripe Payments & Webhooks
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      # Redis Queue & Cache
      - REDIS_HOST=${REDIS_HOST:-127.0.0.1}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # SMTP Mail
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - DISPATCH_EMAIL=${DISPATCH_EMAIL}
    networks:
      - global_network
    volumes:
      # Mount the .env file from VPS host (same pattern as your Laravel projects)
      - /var/www/gm_taxi_service/.env:/app/.env:ro
      # Persistent Media Storage Volume (Laravel storage/app/public equivalent)
      - /var/www/gm_taxi_service/uploads:/app/public/uploads

networks:
  global_network:
    external: true
